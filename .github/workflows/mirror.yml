name: Mirror newest stable Mihomo release

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: mihomo-mirror
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out mirror repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          sudo rm -rf /var/lib/apt/lists/*

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | skopeo login \
            --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            --username "$GITHUB_ACTOR" \
            --password-stdin \
            ghcr.io

      - name: Remove obsolete Docker latest package version
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ids_file="$RUNNER_TEMP/mihomo-package-version-ids.txt"
          error_file="$RUNNER_TEMP/mihomo-package-api-error.txt"
          if ! gh api --paginate \
            --jq '.[] | select((.metadata.container.tags // []) | index("latest")) | .id' \
            "/orgs/${PACKAGE_OWNER}/packages/container/mihomo/versions?per_page=100" \
            >"$ids_file" 2>"$error_file"; then
            cat "$error_file" >&2
            if grep -q 'HTTP 404' "$error_file"; then
              echo "Package does not exist yet; nothing to remove."
              exit 0
            fi
            exit 1
          fi
          while IFS= read -r version_id; do
            [ -n "$version_id" ] || continue
            echo "Deleting obsolete package version $version_id (tag latest)."
            gh api --method DELETE \
              "/orgs/${PACKAGE_OWNER}/packages/container/mihomo/versions/${version_id}"
          done < "$ids_file"

      - name: Synchronize newest stable version tag
        run: |
          python3 scripts/mirror.py \
            --config mirror-config.json \
            --authfile "$RUNNER_TEMP/ghcr-auth.json"

      - name: Commit verified state and heartbeat
        run: |
          set -euo pipefail
          git config user.name "Hermes Agent"
          git config user.email "hermes-agent@users.noreply.github.com"
          git add state/mirror.json maintenance/heartbeat.txt

          if git diff --cached --quiet; then
            echo "No repository content changes."
            exit 0
          fi

          if git diff --cached --name-only | grep -qx 'maintenance/heartbeat.txt' && \
             [ "$(git diff --cached --name-only | wc -l)" -eq 1 ]; then
            message="chore: refresh mirror heartbeat"
          else
            message="chore: synchronize newest Mihomo release"
          fi

          git commit -m "$message"
          git push origin HEAD:main
